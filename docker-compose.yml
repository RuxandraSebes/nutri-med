services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-nutrimed}
      MYSQL_USER: ${MYSQL_USER:-nutrimed}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nutrimed_pw}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pw}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-root_pw}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-service:
    build:
      context: ./backend/auth-service
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-nutrimed}
      MYSQL_USER: ${MYSQL_USER:-nutrimed}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nutrimed_pw}
      AUTH_SERVICE_PORT: 3010
      JWT_SECRET: ${JWT_SECRET:-nutri-med-dev-jwt-change-in-prod}
    ports:
      - "3010:3010"
    depends_on:
      mysql:
        condition: service_healthy

  patient-service:
    build:
      context: ./backend/patient-service
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-nutrimed}
      MYSQL_USER: ${MYSQL_USER:-nutrimed}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nutrimed_pw}
      PATIENT_SERVICE_PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-nutri-med-dev-jwt-change-in-prod}
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy

  medical-service:
    build:
      context: ./backend/medical-service
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-nutrimed}
      MYSQL_USER: ${MYSQL_USER:-nutrimed}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nutrimed_pw}
      MEDICAL_SERVICE_PORT: 3002
      JWT_SECRET: ${JWT_SECRET:-nutri-med-dev-jwt-change-in-prod}
    ports:
      - "3002:3002"
    depends_on:
      mysql:
        condition: service_healthy

  recommendation-service:
    build:
      context: ./backend/recommendation-service
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-nutrimed}
      MYSQL_USER: ${MYSQL_USER:-nutrimed}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nutrimed_pw}
      RECOMMENDATION_SERVICE_PORT: 3003
      PATIENT_SERVICE_URL: http://patient-service:3001
      MEDICAL_SERVICE_URL: http://medical-service:3002
      AI_SERVICE_URL: http://ai-service:5001
      AI_MATRIX_POLL_TIMEOUT_MS: ${AI_MATRIX_POLL_TIMEOUT_MS:-1200000}
      AI_MATRIX_POLL_INTERVAL_MS: ${AI_MATRIX_POLL_INTERVAL_MS:-8000}
      AI_MATRIX_POLL_MAX_ATTEMPTS: ${AI_MATRIX_POLL_MAX_ATTEMPTS:-200}
      JWT_SECRET: ${JWT_SECRET:-nutri-med-dev-jwt-change-in-prod}
    ports:
      - "3003:3003"
    depends_on:
      mysql:
        condition: service_healthy
      patient-service:
        condition: service_started
      medical-service:
        condition: service_started

  # Optional GPU (NVIDIA): add deploy.resources.reservations.devices + nvidia runtime
  # to cut inference time sharply; CPU-only is fine for development.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Best-effort model pull (does NOT block other services — run manual pull if this fails).
  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    # Wait for daemon inside `ollama` to listen, then pull. Exit 0 even if pull fails so `compose up` succeeds.
    command:
      [
        "sh",
        "-c",
        'sleep 15 && (ollama pull llama3.2:3b || echo "ollama-init: pull failed — run: docker compose exec ollama ollama pull llama3.2:3b")',
      ]

  ai-service:
    build:
      context: ./ai-service
    environment:
      PORT: 5001
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-8192}
      OLLAMA_REPAIR_NUM_PREDICT: ${OLLAMA_REPAIR_NUM_PREDICT:-8192}
      OLLAMA_BATCH_NUM_PREDICT: ${OLLAMA_BATCH_NUM_PREDICT:-1800}
      OLLAMA_BATCH_NUM_CTX: ${OLLAMA_BATCH_NUM_CTX:-6000}
      OLLAMA_NOTES_NUM_PREDICT: ${OLLAMA_NOTES_NUM_PREDICT:-256}
      LLM_PATIENT_CTX_MAX: ${LLM_PATIENT_CTX_MAX:-2200}
      LLM_NUTRITION_LINES_MAX: ${LLM_NUTRITION_LINES_MAX:-28}
      RAG_NUTRITION_TOP_K: ${RAG_NUTRITION_TOP_K:-6}
      # 1 = no Chroma/embeddings in ai-service; matrix uses MySQL patient context only; log prompts by default.
      MATRIX_SKIP_RAG: "1"
      MATRIX_SIMPLE_MODE: "1"
      MATRIX_LOG_PROMPTS: ${MATRIX_LOG_PROMPTS:-}
      MATRIX_LOG_PROMPTS_MAX_CHARS: ${MATRIX_LOG_PROMPTS_MAX_CHARS:-0}
      RAG_CONTEXT_MAX_CHARS: ${RAG_CONTEXT_MAX_CHARS:-12000}
      RAG_MIN_DOCS: ${RAG_MIN_DOCS:-3}
      RAG_SIMILAR_TOP_K: ${RAG_SIMILAR_TOP_K:-3}
      RAG_SIMILAR_CTX_STRING_CAP: ${RAG_SIMILAR_CTX_STRING_CAP:-6000}
      RAG_USE_METADATA_FILTER: ${RAG_USE_METADATA_FILTER:-1}
      RAG_EMBED_CACHE: ${RAG_EMBED_CACHE:-1}
      RAG_EMBED_CACHE_SIZE: ${RAG_EMBED_CACHE_SIZE:-4096}
      RAG_RESPONSE_CACHE: ${RAG_RESPONSE_CACHE:-1}
      RAG_RESPONSE_CACHE_SIZE: ${RAG_RESPONSE_CACHE_SIZE:-512}
      ANONYMIZED_TELEMETRY: "False"
      MATRIX_KCAL_TOLERANCE: ${MATRIX_KCAL_TOLERANCE:-150}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-nutrimed}
      MYSQL_USER: ${MYSQL_USER:-nutrimed}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nutrimed_pw}
      CHROMA_NUTRITION_DIR: /app/db_nutritie
      CHROMA_PATIENTS_DIR: /app/db_pacienti
    ports:
      - "3011:5001"
    volumes:
      - ./ai-service/db_nutritie:/app/db_nutritie
      - ./ai-service/db_pacienti:/app/db_pacienti
    depends_on:
      ollama:
        condition: service_healthy
      mysql:
        condition: service_healthy

  api-gateway:
    build:
      context: ./backend/api-gateway
    environment:
      PORT: 3000
      GATEWAY_PROXY_TIMEOUT_MS: ${GATEWAY_PROXY_TIMEOUT_MS:-1200000}
      PATIENT_SERVICE_URL: http://patient-service:3001
      MEDICAL_SERVICE_URL: http://medical-service:3002
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:3003
      AUTH_SERVICE_URL: http://auth-service:3010
      AI_SERVICE_URL: http://ai-service:5001
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_started
      patient-service:
        condition: service_started
      medical-service:
        condition: service_started
      recommendation-service:
        condition: service_started
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_BASE: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  mysql_data:
  ollama_data:
